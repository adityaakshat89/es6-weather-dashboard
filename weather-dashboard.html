<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skye — Weather Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f1a;
      --surface: #131829;
      --surface2: #1c2338;
      --border: rgba(255,255,255,0.07);
      --text: #e8eaf6;
      --muted: rgba(232,234,246,0.5);
      --accent: #7eb8f7;
      --accent2: #a78bfa;
      --warm: #fbbf24;
      --danger: #f87171;
      --success: #34d399;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    /* Subtle animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(126,184,247,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 90%, rgba(167,139,250,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .logo span { color: var(--accent); }

    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ── Search ── */
    .search-wrap {
      margin-bottom: 2.5rem;
    }

    .search-box {
      display: flex;
      gap: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.5rem 0.5rem 0.5rem 1.25rem;
      transition: border-color 0.2s;
    }

    .search-box:focus-within {
      border-color: rgba(126,184,247,0.4);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      caret-color: var(--accent);
    }

    .search-box input::placeholder { color: var(--muted); }

    .search-box button {
      background: var(--accent);
      color: #0b0f1a;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.4rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .search-box button:hover { opacity: 0.85; }
    .search-box button:active { transform: scale(0.97); }
    .search-box button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Error ── */
    .error-msg {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      color: var(--danger);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-top: 0.75rem;
      font-size: 0.875rem;
      display: none;
    }

    /* ── Hero card ── */
    #weather { display: none; }

    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem 2rem 1.75rem;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: attr(data-icon);
      position: absolute;
      right: -0.5rem;
      top: -1rem;
      font-size: 8rem;
      opacity: 0.08;
      pointer-events: none;
      line-height: 1;
    }

    .city-name {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }

    .country-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    .temp-row {
      display: flex;
      align-items: flex-end;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .main-temp {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(3.5rem, 10vw, 5.5rem);
      line-height: 1;
      color: var(--accent);
    }

    .weather-desc {
      font-size: 1.1rem;
      color: var(--muted);
      padding-bottom: 0.5rem;
      max-width: 200px;
      line-height: 1.3;
    }

    /* ── Stats grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.25rem 1rem;
    }

    .stat-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 300;
      line-height: 1;
      color: var(--text);
    }

    .stat-value span {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 400;
    }

    /* ── Forecast ── */
    .section-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 0.75rem;
    }

    .forecast-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 0.75rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .forecast-day:hover { border-color: rgba(126,184,247,0.25); }

    .day-name {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .day-icon { font-size: 1.6rem; margin-bottom: 0.5rem; }

    .day-temps {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .day-high { color: var(--warm); font-weight: 500; }
    .day-low  { color: var(--muted); }

    /* ── Loading skeleton ── */
    .skeleton { display: none; }
    .skeleton-line {
      background: var(--surface2);
      border-radius: 6px;
      animation: shimmer 1.2s infinite ease-in-out;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ── Placeholder ── */
    #placeholder {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }

    #placeholder .big-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.4; }
    #placeholder p { font-size: 0.95rem; max-width: 300px; margin: 0 auto; line-height: 1.6; }

    /* ── Footer ── */
    footer {
      margin-top: 2.5rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    footer a { color: var(--accent); text-decoration: none; }

    /* ── Fade-in animation ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .fade-in { animation: fadeUp 0.4s ease forwards; }
  </style>
</head>
<body>
  <div class="app">

    <header>
      <div class="logo">sky<span>e</span></div>
      <div class="tagline">Weather Dashboard</div>
    </header>

    <!-- Search -->
    <div class="search-wrap">
      <div class="search-box">
        <input
          type="text"
          id="city-input"
          placeholder="Search a city — try Mumbai, New York, London..."
          autocomplete="off"
        />
        <button id="search-btn">Search</button>
      </div>
      <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- Placeholder state -->
    <div id="placeholder">
      <div class="big-icon">🌤</div>
      <p>Enter a city name above to get the current weather and a 7-day forecast.</p>
    </div>

    <!-- Weather output -->
    <div id="weather">
      <!-- Hero card -->
      <div class="hero-card fade-in" id="hero-card" data-icon="">
        <div class="city-name" id="city-name">—</div>
        <div class="country-label" id="country-label">—</div>
        <div class="temp-row">
          <div class="main-temp" id="main-temp">—°</div>
          <div class="weather-desc" id="weather-desc">—</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid fade-in" style="animation-delay:0.05s">
        <div class="stat-card">
          <div class="stat-label">Feels like</div>
          <div class="stat-value" id="feels-like">—<span>°C</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="humidity">—<span>%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Wind speed</div>
          <div class="stat-value" id="wind">—<span> km/h</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">UV index</div>
          <div class="stat-value" id="uv">—</div>
        </div>
      </div>

      <!-- 7-Day Forecast -->
      <div class="fade-in" style="animation-delay:0.1s; margin-top:1.5rem;">
        <div class="section-label">7-Day Forecast</div>
        <div class="forecast-grid" id="forecast-grid"></div>
      </div>
    </div>

    <footer>
      Data from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a> &mdash; free &amp; open-source weather API
    </footer>
  </div>

  <script>
    /* ══════════════════════════════════════════
       WMO Weather Code → { label, emoji }
       ══════════════════════════════════════════ */
    const weatherInfo = (code) => {
      const map = {
        0:  { label: 'Clear sky',            emoji: '☀️'  },
        1:  { label: 'Mainly clear',         emoji: '🌤️' },
        2:  { label: 'Partly cloudy',        emoji: '⛅'  },
        3:  { label: 'Overcast',             emoji: '☁️'  },
        45: { label: 'Foggy',               emoji: '🌫️' },
        48: { label: 'Freezing fog',         emoji: '🌫️' },
        51: { label: 'Light drizzle',        emoji: '🌦️' },
        53: { label: 'Drizzle',              emoji: '🌦️' },
        55: { label: 'Heavy drizzle',        emoji: '🌧️' },
        61: { label: 'Light rain',           emoji: '🌧️' },
        63: { label: 'Rain',                 emoji: '🌧️' },
        65: { label: 'Heavy rain',           emoji: '🌧️' },
        71: { label: 'Light snow',           emoji: '🌨️' },
        73: { label: 'Snow',                 emoji: '❄️'  },
        75: { label: 'Heavy snow',           emoji: '❄️'  },
        80: { label: 'Rain showers',         emoji: '🌦️' },
        81: { label: 'Showers',              emoji: '🌧️' },
        82: { label: 'Heavy showers',        emoji: '⛈️'  },
        95: { label: 'Thunderstorm',         emoji: '⛈️'  },
        96: { label: 'Thunderstorm w/ hail', emoji: '⛈️'  },
        99: { label: 'Thunderstorm w/ hail', emoji: '⛈️'  },
      };
      return map[code] ?? { label: 'Unknown', emoji: '🌡️' };
    };

    /* ══════════════════════════════════════════
       Geocoding: city name → { lat, lon, name, country }
       ══════════════════════════════════════════ */
    const geocode = async (city) => {
      const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;
      const res  = await fetch(url);
      const data = await res.json();

      if (!data.results?.length) throw new Error(`City "${city}" not found. Try a different name.`);

      const { latitude, longitude, name, country } = data.results[0];
      return { lat: latitude, lon: longitude, name, country };
    };

    /* ══════════════════════════════════════════
       Weather fetch: { lat, lon } → weather object
       ══════════════════════════════════════════ */
    const fetchWeather = async ({ lat, lon }) => {
      const params = new URLSearchParams({
        latitude:  lat,
        longitude: lon,
        current: [
          'temperature_2m',
          'apparent_temperature',
          'relative_humidity_2m',
          'wind_speed_10m',
          'weather_code',
          'uv_index',
        ].join(','),
        daily: [
          'weather_code',
          'temperature_2m_max',
          'temperature_2m_min',
        ].join(','),
        timezone: 'auto',
        forecast_days: 7,
      });

      const res  = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
      const data = await res.json();
      return data;
    };

    /* ══════════════════════════════════════════
       Render: populate the DOM with weather data
       ══════════════════════════════════════════ */
    const render = ({ location, weather }) => {
      const { current, daily } = weather;

      // Destructuring current weather
      const {
        temperature_2m:       temp,
        apparent_temperature: feelsLike,
        relative_humidity_2m: humidity,
        wind_speed_10m:       wind,
        weather_code:         code,
        uv_index:             uv,
      } = current;

      const { label, emoji } = weatherInfo(code);

      // Hero card
      document.getElementById('city-name').textContent  = location.name;
      document.getElementById('country-label').textContent = location.country;
      document.getElementById('main-temp').textContent   = `${Math.round(temp)}°`;
      document.getElementById('weather-desc').textContent = label;
      document.getElementById('hero-card').dataset.icon  = emoji;

      // Stat cards
      document.getElementById('feels-like').innerHTML = `${Math.round(feelsLike)}<span>°C</span>`;
      document.getElementById('humidity').innerHTML   = `${humidity}<span>%</span>`;
      document.getElementById('wind').innerHTML       = `${Math.round(wind)}<span> km/h</span>`;
      document.getElementById('uv').textContent       = uv != null ? Math.round(uv) : 'N/A';

      // 7-Day forecast using arrow function + destructuring + map
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

      const forecastHTML = daily.time.map((dateStr, i) => {
        const { emoji: dayEmoji } = weatherInfo(daily.weather_code[i]);
        const dayName = i === 0 ? 'Today' : days[new Date(dateStr).getDay()];
        const hi = Math.round(daily.temperature_2m_max[i]);
        const lo = Math.round(daily.temperature_2m_min[i]);

        return `
          <div class="forecast-day">
            <div class="day-name">${dayName}</div>
            <div class="day-icon">${dayEmoji}</div>
            <div class="day-temps">
              <span class="day-high">${hi}°</span>
              <span class="day-low">${lo}°</span>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('forecast-grid').innerHTML = forecastHTML;

      // Show weather section
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('weather').style.display     = 'block';
    };

    /* ══════════════════════════════════════════
       Main search handler (async/await + Promise chain)
       ══════════════════════════════════════════ */
    const search = async () => {
      const input  = document.getElementById('city-input');
      const btn    = document.getElementById('search-btn');
      const errBox = document.getElementById('error-msg');

      const city = input.value.trim();
      if (!city) return;

      // Reset error
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '...';

      try {
        const location = await geocode(city);
        const weather  = await fetchWeather(location);
        render({ location, weather });
      } catch (err) {
        errBox.textContent   = err.message || 'Something went wrong. Please try again.';
        errBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search';
      }
    };

    /* ── Event listeners ── */
    document.getElementById('search-btn').addEventListener('click', search);

    document.getElementById('city-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') search();
    });
  </script>
</body>
</html>
